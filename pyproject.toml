[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamreels"
version = "2.0.0a1"
description = "DreamReels - a forkable 10-foot home media player with Dreamy, public-domain cinema, your NAS, and an ad-free YouTube lane."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "python-mpv>=1.0.7",
  "requests>=2.31",
  "mutagen>=1.47",
  "zeroconf>=0.132",
  "qrcode>=7.4",
  "yt-dlp>=2026.6.1",
]

[project.optional-dependencies]
gamepad = ["evdev>=1.6"]
smb = ["smbprotocol>=1.13"]
dev = ["pytest>=8"]

[project.scripts]
dreamreels = "dreamreels.__main__:main"

[tool.setuptools.packages.find]
include = ["dreamreels*"]
