<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">What DreamReels does</title>
<desc id="d">Four panels detailing DreamReels features: public domain lanes from archive.org plus local NAS and YouTube; Dreamy the setup agent; decode verification before play; and single-file Windows exe built on GitHub Actions.</desc>
<rect width="1200" height="330" fill="#0B1015"/>

<!-- PANEL 1: LANES & SOURCES -->
<g transform="translate(24, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#161E27" stroke="#33424F"/>
  <!-- Mini graphic 1 -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="68" height="84" rx="4" fill="#1E2833" stroke="#2DD4E8"/>
    <circle cx="34" cy="34" r="16" fill="#0D131A" stroke="#2DD4E8" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="3" fill="#F3F7F9"/>
    <text x="34" y="68" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#2DD4E8" text-anchor="middle">ARCHIVE</text>

    <rect x="81" y="0" width="68" height="84" rx="4" fill="#1E2833" stroke="#F5A524"/>
    <rect x="95" y="18" width="40" height="28" rx="2" fill="#0D131A" stroke="#F5A524" stroke-width="1.5"/>
    <circle cx="103" cy="27" r="2" fill="#4ADE80"/>
    <circle cx="103" cy="37" r="2" fill="#4ADE80"/>
    <text x="115" y="68" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#F5A524" text-anchor="middle">NAS SMB</text>

    <rect x="162" y="0" width="68" height="84" rx="4" fill="#1E2833" stroke="#FB7185"/>
    <rect x="176" y="18" width="40" height="28" rx="2" fill="#0D131A" stroke="#FB7185" stroke-width="1.5"/>
    <polygon points="192,26 204,32 192,38" fill="#FB7185"/>
    <text x="196" y="68" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#FB7185" text-anchor="middle">YOUTUBE</text>
  </g>
  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2DD4E8" letter-spacing="1.5">01 / LANES &amp; SOURCES</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F3F7F9">
    <text x="24" y="182">archive.org public domain</text>
    <text x="24" y="206">plus local SMB NAS shares</text>
    <text x="24" y="230">and ad-free YouTube.</text>
  </g>
</g>

<!-- PANEL 2: DREAMY THE AGENT -->
<g transform="translate(314, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#161E27" stroke="#33424F"/>
  <!-- Mini graphic 2 -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="231" height="84" rx="5" fill="#1E2833" stroke="#33424F"/>
    <rect x="0" y="0" width="231" height="18" rx="5" fill="#0D131A"/>
    <circle cx="10" cy="9" r="3" fill="#FB7185"/>
    <circle cx="20" cy="9" r="3" fill="#F5A524"/>
    <circle cx="30" cy="9" r="3" fill="#4ADE80"/>
    <text x="115" y="13" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#A7B6C2" text-anchor="middle">Dreamy Agent [D]</text>
    <text x="12" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#2DD4E8">&gt; find me 1940s movies</text>
    <rect x="12" y="48" width="130" height="22" rx="3" fill="#0D131A" stroke="#4ADE80"/>
    <text x="77" y="63" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#4ADE80" text-anchor="middle">[PLAY] 12 verified</text>
    <!-- Mascot reel icon -->
    <circle cx="190" cy="51" r="18" fill="#0D131A" stroke="#2DD4E8" stroke-width="1.5"/>
    <circle cx="190" cy="51" r="3" fill="#F3F7F9"/>
  </g>
  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2DD4E8" letter-spacing="1.5">02 / DREAMY THE AGENT</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F3F7F9">
    <text x="24" y="182">Setup walkthrough &amp; agent.</text>
    <text x="24" y="206">Ask in plain words to find</text>
    <text x="24" y="230">movies, shows and channels.</text>
  </g>
</g>

<!-- PANEL 3: DECODE PROOF -->
<g transform="translate(604, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#161E27" stroke="#33424F"/>
  <!-- Mini graphic 3 -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="231" height="84" rx="5" fill="#1E2833" stroke="#33424F"/>
    <rect x="24" y="14" width="183" height="56" rx="4" fill="#0D131A" stroke="#4ADE80" stroke-width="1.5"/>
    <path d="M 38 42 L 48 52 L 68 32" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="40" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#4ADE80">DECODE PROOF</text>
    <text x="80" y="56" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" fill="#F3F7F9">48/48 frames in mpv</text>
  </g>
  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2DD4E8" letter-spacing="1.5">03 / DECODE PROOF</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F3F7F9">
    <text x="24" y="182">48-frame decode in libmpv</text>
    <text x="24" y="206">before marking playable.</text>
    <text x="24" y="230">Never a broken button.</text>
  </g>
</g>

<!-- PANEL 4: WINDOWS & LINUX -->
<g transform="translate(894, 24)">
  <rect x="0.5" y="0.5" width="279" height="281" rx="6" fill="#161E27" stroke="#33424F"/>
  <!-- Mini graphic 4 -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="231" height="84" rx="5" fill="#1E2833" stroke="#33424F"/>
    <!-- Windows exe box -->
    <rect x="16" y="14" width="90" height="56" rx="4" fill="#0D131A" stroke="#2DD4E8" stroke-width="1.5"/>
    <text x="61" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#F3F7F9" text-anchor="middle">DreamReels</text>
    <text x="61" y="54" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#2DD4E8" text-anchor="middle">.exe</text>
    <!-- Arrow -->
    <path d="M 114 42 H 130" stroke="#F5A524" stroke-width="2"/>
    <polygon points="128,38 136,42 128,46" fill="#F5A524"/>
    <!-- CI Badge -->
    <rect x="140" y="14" width="75" height="56" rx="4" fill="#0D131A" stroke="#F5A524" stroke-width="1.5"/>
    <text x="177" y="38" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="9" font-weight="700" fill="#F5A524" text-anchor="middle">ACTIONS</text>
    <text x="177" y="54" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="8" fill="#4ADE80" text-anchor="middle">WIN + LINUX</text>
  </g>
  <text x="24" y="150" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#2DD4E8" letter-spacing="1.5">04 / WINDOWS &amp; LINUX</text>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#F3F7F9">
    <text x="24" y="182">Single-file Windows exe</text>
    <text x="24" y="206">built on GitHub Actions.</text>
    <text x="24" y="230">Easy install on Win &amp; Linux.</text>
  </g>
</g>
</svg>